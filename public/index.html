<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DNL Management · Quartos e casas para alugar</title>
<meta name="description" content="Quartos, estúdios e casas para aluguel mensal. Veja fotos, localização e agende uma visita.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<link rel="icon" type="image/svg+xml" href="/img/dnl-icon.svg">
</head>
<body>
<div id="hdr"></div>
<nav class="cats"><div class="wrap" id="cats"></div></nav>
<main class="wrap" id="anuncios">
  <div class="grid" id="grid"></div>
</main>
<div id="ftr"></div>

<script src="/js/common.js"></script>
<script>
document.getElementById('hdr').innerHTML = headerHTML({ search: true });
document.getElementById('ftr').innerHTML = footerHTML();
document.title = { pt: 'DNL Management · Quartos para alugar em Cork e Dublin', en: 'DNL Management · Rooms to rent in Cork and Dublin', es: 'DNL Management · Habitaciones en alquiler en Cork y Dublín' }[LANG];

let all = [], cat = 'Todos';
const $ = (s) => document.querySelector(s);

$('#cats').innerHTML = TYPES.map((x) =>
  `<button class="cat${x.k === cat ? ' active' : ''}" data-k="${x.k}">${I[x.icon]}<span>${tType(x.k)}</span></button>`).join('');
$('#cats').addEventListener('click', (e) => {
  const b = e.target.closest('.cat'); if (!b) return;
  cat = b.dataset.k;
  document.querySelectorAll('.cat').forEach((c) => c.classList.toggle('active', c === b));
  render();
});
['q', 'qmax', 'qwhen'].forEach((id) => $('#' + id).addEventListener('input', render));

function skeleton() {
  $('#grid').innerHTML = Array.from({ length: 8 }, () => `
    <div><div class="sk" style="aspect-ratio:20/19;border-radius:12px"></div>
    <div class="sk" style="height:14px;width:70%;margin-top:14px"></div>
    <div class="sk" style="height:14px;width:45%;margin-top:8px"></div></div>`).join('');
}

function cardHTML(l) {
  const photos = l.photos.length ? l.photos.slice(0, 8) : [null];
  const isNew = (Date.now() - new Date(l.created_at.replace(' ', 'T') + 'Z')) < 14 * 864e5;
  return `
  <a class="card${l.rented ? ' rented' : ''}" href="${withLang('/anuncio/' + l.id)}" data-id="${l.id}">
    <div class="media">
      <div class="track">${photos.map((p) => p ? `<img src="${esc(p)}" alt="" loading="lazy">` : `<div style="width:100%;flex-shrink:0;display:grid;place-items:center;color:#bbb">${I.house.replace('<svg', '<svg width="48"')}</div>`).join('')}</div>
      ${l.rented ? `<span class="badge badge-rented">${t('rented')}</span>` : isNew ? `<span class="badge">${t('isNew')}</span>` : ''}
      <button class="fav${favs.has(l.id) ? ' on' : ''}" aria-label="${t('fav')}">${I.heart}</button>
      ${photos.length > 1 ? `
        <button class="nav prev" aria-label="${t('prev')}" style="display:none">${I.left}</button>
        <button class="nav next" aria-label="${t('next')}">${I.right}</button>
        <div class="dots">${photos.slice(0, 5).map((_, i) => `<i class="${i ? '' : 'on'}"></i>`).join('')}</div>` : ''}
    </div>
    <div class="info">
      <div class="row1"><span class="t">${esc(t('typeIn', { type: tType(l.type), area: l.area || 'Cork' }))}</span></div>
      <div class="sub">${esc(lt(l, 'title'))}</div>
      <div class="sub">${l.rented ? t('rentedLine') : availText(l.available_from)}</div>
      <div class="price">${l.rented ? `<b>${t('rented')}</b>` : `<b>${eur(l.price)}</b> ${t('month')}${l.bills_included ? ' · ' + t('billsInc') : ''}`}</div>
    </div>
  </a>`;
}

function filtered() {
  const q = $('#q').value.trim().toLowerCase();
  const max = parseInt($('#qmax').value) || Infinity;
  const when = $('#qwhen').value;
  return all.filter((l) => {
    if (cat !== 'Todos' && l.type !== cat) return false;
    if (q && !`${l.title} ${lt(l, 'title')} ${l.area} ${l.address} ${lt(l, 'description')}`.toLowerCase().includes(q)) return false;
    if (l.rented && (max !== Infinity || when !== '')) return false;
    if (l.price > max) return false;
    if (when !== '') {
      const lim = Date.now() + parseInt(when) * 864e5 + 864e5;
      const d = l.available_from ? new Date(l.available_from + 'T12:00:00').getTime() : 0;
      if (d > lim) return false;
    }
    return true;
  });
}

function render() {
  const list = filtered();
  if (!list.length) {
    $('#grid').innerHTML = `<div class="empty" style="grid-column:1/-1">
      <h2>${all.length ? t('noneFound') : t('soon')}</h2>
      <p>${all.length ? t('tryFilters') : t('preparing')}</p></div>`;
    return;
  }
  $('#grid').innerHTML = list.map(cardHTML).join('');
}

// Carrossel de cada card
$('#grid').addEventListener('click', (e) => {
  const card = e.target.closest('.card'); if (!card) return;
  const fav = e.target.closest('.fav');
  if (fav) {
    e.preventDefault();
    const on = favs.toggle(+card.dataset.id);
    fav.classList.toggle('on', on);
    toast(on ? t('favSaved') : t('favRemoved'));
    return;
  }
  const nav = e.target.closest('.nav'); if (!nav) return;
  e.preventDefault();
  const track = card.querySelector('.track'), n = track.children.length;
  let i = (+card.dataset.i || 0) + (nav.classList.contains('next') ? 1 : -1);
  i = Math.max(0, Math.min(n - 1, i)); card.dataset.i = i;
  track.style.transform = `translateX(-${i * 100}%)`;
  card.querySelector('.prev').style.display = i ? '' : 'none';
  card.querySelector('.next').style.display = i < n - 1 ? '' : 'none';
  const dots = card.querySelectorAll('.dots i'), d = Math.min(i, dots.length - 1);
  dots.forEach((x, k) => x.classList.toggle('on', k === (i >= dots.length ? dots.length - 1 : d)));
});

skeleton();
api('/api/listings').then((r) => { all = r; render(); }).catch(() => { $('#grid').innerHTML = `<div class="empty" style="grid-column:1/-1"><h2>${t('loadFail')}</h2><p>${t('refresh')}</p></div>`; });
</script>
</body>
</html>
