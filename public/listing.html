<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Anúncio · DNL Management</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="/css/style.css">
<link rel="icon" type="image/svg+xml" href="/img/dnl-icon.svg">
</head>
<body class="has-mbar">
<div id="hdr"></div>
<main id="page">
  <div class="lwrap" style="padding-top:24px"><div class="sk" style="height:30px;width:50%"></div>
  <div class="sk" style="height:420px;margin-top:24px;border-radius:12px"></div></div>
</main>
<div id="ftr"></div>

<!-- Modal de agendamento (mobile) -->
<div class="modal" id="schedModal"><div class="sheet">
  <div class="sheet-h"><button class="x" data-close aria-label="Close"></button><span id="schedTitle"></span></div>
  <div class="sheet-b" id="schedMobile"></div>
</div></div>

<!-- Todas as fotos -->
<div class="photos-full" id="allPhotos">
  <div class="top"><button class="btn-ghost btn" id="closeAll" style="text-decoration:none;display:flex;gap:6px"></button></div>
  <div class="list" id="allList"></div>
</div>
<div class="lightbox" id="lb">
  <button class="lbx" id="lbx"></button><div class="lbt" id="lbt"></div>
  <button class="lbn p" id="lbp"></button><img id="lbi" alt=""><button class="lbn n" id="lbn"></button>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="/js/common.js"></script>
<script>
document.getElementById('hdr').innerHTML = headerHTML();
document.getElementById('ftr').innerHTML = footerHTML();
const $ = (s, r = document) => r.querySelector(s);
const id = location.pathname.split('/').pop();
$('#schedTitle').textContent = t('book');
let L, lbIndex = 0;

// Horários livres vêm da agenda configurada no admin
let AV = [];
const slotsHTML = (date) => {
  const d = AV.find((x) => x.date === date);
  return (d ? d.times : []).map((s, i) => `<button type="button" class="slot${i === 0 ? ' on' : ''}" data-t="${s}">${s}</button>`).join('');
};

function scheduleForm(prefix) {
  if (!AV.length) return `<div class="done"><p>${t('noSlots')}</p></div>`;
  const first = AV[0];
  return `
  <form class="space sched" data-p="${prefix}" novalidate>
    <div class="fgroup">
      <label class="field"><span>${t('date')}</span>
        <select name="date" required>${AV.map((d) => `<option value="${d.date}">${dShort(d.date, { weekday: 'short', day: 'numeric', month: 'short' })}</option>`).join('')}</select></label>
      <label class="field"><span>${t('peopleL')}</span>
        <select name="people">${[1, 2, 3, 4].map((n) => `<option value="${n}">${pl(n, 'person')}</option>`).join('')}</select></label>
    </div>
    <div class="slot-label">${t('time')}</div>
    <div class="slots">${slotsHTML(first.date)}</div>
    <input type="hidden" name="time" value="${first.times[0]}">
    <div class="fgroup">
      <label class="field"><span>${t('name')}</span><input name="name" required autocomplete="name"></label>
      <label class="field"><span>${t('email')}</span><input name="email" type="email" required autocomplete="email"></label>
      <label class="field"><span>${t('phone')}</span><input name="phone" type="tel" required autocomplete="tel" placeholder="+353"></label>
      <label class="field"><span>${t('msg')}</span><textarea name="message" rows="2" placeholder="${t('msgPh')}"></textarea></label>
    </div>
    <input class="hp" name="website" tabindex="-1" autocomplete="off">
    <div class="err" hidden></div>
    <button class="btn btn-brand btn-block" type="submit">${t('book')}</button>
    <p class="tiny" style="margin:0">${t('free')}</p>
  </form>`;
}

function bindForms() {
  document.querySelectorAll('.sched').forEach((f) => {
    f.date.addEventListener('change', () => {
      $('.slots', f).innerHTML = slotsHTML(f.date.value);
      const d = AV.find((x) => x.date === f.date.value);
      f.time.value = d ? d.times[0] : '';
    });
    f.addEventListener('click', (e) => {
      const s = e.target.closest('.slot'); if (!s) return;
      f.querySelectorAll('.slot').forEach((x) => x.classList.toggle('on', x === s));
      f.time.value = s.dataset.t;
    });
    f.addEventListener('submit', async (e) => {
      e.preventDefault();
      const err = $('.err', f), btn = $('button[type=submit]', f);
      const data = Object.fromEntries(new FormData(f));
      if (!data.name.trim() || !data.email.trim() || !data.phone.trim()) { err.hidden = false; err.textContent = t('fillReq'); return; }
      if (!/^\S+@\S+\.\S+$/.test(data.email)) { err.hidden = false; err.textContent = t('checkEmail'); return; }
      err.hidden = true; btn.disabled = true; btn.textContent = t('sending');
      try {
        await api('/api/visits', { method: 'POST', body: { ...data, listing_id: L.id, lang: LANG } });
        const when = dShort(data.date, { weekday: 'long', day: 'numeric', month: 'long' });
        f.outerHTML = `<div class="done"><div class="ok">${I.check}</div><h4>${t('sentTitle')}</h4>
          <p>${t('sentBody', { when: `<b style="color:#222">${when}`, time: `${esc(data.time)}</b>` })}</p></div>`;
      } catch (ex) {
        if (ex.status === 409) { // horário ocupado: atualiza a lista
          try { AV = (await api('/api/schedule/' + L.id)).available || []; $('.slots', f).innerHTML = slotsHTML(f.date.value); const d = AV.find((x) => x.date === f.date.value); f.time.value = d ? d.times[0] : ''; } catch {}
        }
        err.hidden = false; err.textContent = ex.status === 409 ? t('slotTaken') : (LANG === 'pt' ? ex.message : t('genericErr')); btn.disabled = false; btn.textContent = t('book');
      }
    });
  });
}

function rentedHTML() {
  return `<div class="rented-box"><div class="ok">${I.key}</div><h4>${t('rentedTitle')}</h4>
    <p>${t('rentedSub')}</p>
    <a class="btn btn-brand btn-block" href="${withLang('/')}">${t('seeAvailRooms')}</a></div>`;
}

function galleryHTML(p) {
  const n = Math.min(p.length, 5);
  if (!n) return `<div class="gallery n1"><div style="display:grid;place-items:center;color:#bbb;background:#f7f7f7">${I.house.replace('<svg', '<svg width="64"')}</div></div>`;
  return `<div class="gallery n${n}">
    ${p.slice(0, 5).map((src, i) => `<button class="g${i}" data-i="${i}"><img src="${esc(src)}" alt="${t('photo')} ${i + 1}"></button>`).join('')}
    ${p.length > 1 ? `<button class="all" id="showAll">${I.grid} ${t('showAll')}</button>` : ''}
  </div>`;
}

function render() {
  const TITLE = lt(L, 'title'), DESC = lt(L, 'description'), RULES = lt(L, 'house_rules');
  document.title = `${TITLE} · DNL Management`;
  const hasBath = L.amenities.includes('Banheiro privativo');
  const highlights = [
    [I.key, tType(L.type), L.type.startsWith('Quarto') ? t('hlRoom') : t('hlWhole')],
    [I.calendar, availText(L.available_from), L.min_months ? t('minContract', { m: pl(L.min_months, 'month') }) : t('flexContract')],
    L.bills_included ? [I.bolt, t('billsIncT'), t('billsIncD')] : [I.bolt, t('billsSepT'), t('billsSepD')],
  ];
  const facts = [pl(L.guests || 1, 'person'), pl(L.bedrooms || 1, 'bedroom'), pl(L.bathrooms || 1, hasBath ? 'privBath' : 'bathroom')].join(' · ');

  $('#page').innerHTML = `
  <div class="lwrap">
    <div class="l-title">
      <h1>${esc(TITLE)}</h1>
      <div class="l-actions">
        <button class="btn btn-ghost" id="share">${I.share} ${t('share')}</button>
        <button class="btn btn-ghost" id="favBtn"><span style="display:inline-flex;width:16px">${I.heart.replace('<svg', `<svg width="16" style="fill:${favs.has(L.id) ? 'var(--brand)' : 'none'};stroke:#222;stroke-width:2.5"`)}</span> ${t('save')}</button>
      </div>
    </div>
  </div>
  <div class="lwrap flush">${galleryHTML(L.photos)}</div>
  <div class="lwrap">
    <div class="l-body">
      <div>
        <div class="sec l-head">
          <h2>${esc(t('typeIn', { type: tType(L.type), area: L.area || 'Cork' }))}</h2>
          <p>${facts}</p>
        </div>
        <div class="sec"><div class="hl">${highlights.map(([ic, b, s]) => `<div>${ic}<span><b>${esc(b)}</b><small>${esc(s)}</small></span></div>`).join('')}</div></div>
        ${DESC ? `<div class="sec"><h3>${t('about')}</h3><div class="desc">${esc(DESC)}</div></div>` : ''}
        ${L.amenities.length ? `<div class="sec"><h3>${t('offers')}</h3>
          <div class="amen">${L.amenities.map((a) => `<div>${AMENITIES[a] || I.dot}<span>${esc(tAmen(a))}</span></div>`).join('')}</div></div>` : ''}
        ${RULES ? `<div class="sec"><h3>${t('rules')}</h3><div class="desc">${esc(RULES)}</div></div>` : ''}
      </div>
      <div class="bookbox-wrap desktop">
        <div class="bookbox">
          ${L.rented ? rentedHTML() : `<div class="pr"><b>${eur(L.price)}</b><span>${t('month')}</span><small>${L.bills_included ? t('billsInc') : t('plusBills')}</small></div>
          <div id="schedDesk"></div>`}
        </div>
      </div>
    </div>
    <div class="sec" style="border-top:1px solid var(--line)">
      <h3>${t('whereLive')}</h3>
      ${L.lat && L.lng ? '<div id="map"></div>' : ''}
      <div class="map-note"><b>${esc(L.address || ((L.area || 'Cork') + ', ' + t('ireland')))}</b>
        ${L.lat && L.lng ? `<p><a href="https://www.google.com/maps/search/?api=1&query=${L.lat},${L.lng}" target="_blank" rel="noopener" style="color:var(--ink);font-weight:600">${t('openMaps')} ↗</a></p>` : ''}</div>
    </div>
  </div>
  <div class="mbar">${L.rented ? `<div><b>${t('rented')}</b><small>${t('rentedTitle')}</small></div>
    <a class="btn btn-brand" href="${withLang('/')}">${t('seeAvail')}</a>` : `<div><b>${eur(L.price)}</b> ${t('month')}<small>${availText(L.available_from)}</small></div>
    <button class="btn btn-brand" id="openSched">${t('book')}</button>`}</div>`;

  if (!L.rented) $('#schedDesk').innerHTML = scheduleForm('d');
  $('#schedMobile').innerHTML = scheduleForm('m');
  bindForms();

  // Mapa com área aproximada (privacidade)
  if (L.lat && L.lng) {
    const m = window.L ? window.L.map('map', { scrollWheelZoom: false }).setView([L.lat, L.lng], 16) : null;
    if (m) {
      window.L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' }).addTo(m);
      window.L.marker([L.lat, L.lng], { icon: window.L.divIcon({ className: '', html: `<div style="width:48px;height:48px;border-radius:50%;background:#0E2651;display:grid;place-items:center;color:#fff;box-shadow:0 6px 16px rgba(0,0,0,.25)">${I.house.replace('<svg', '<svg width="24" height="24" style="stroke:#fff"')}</div>`, iconSize: [48, 48], iconAnchor: [24, 24] }) }).addTo(m);
    }
  }

  // Ações
  $('#share').onclick = async () => {
    const u = new URL(location.href); u.searchParams.set('lang', LANG);
    try { if (navigator.share) await navigator.share({ title: TITLE, url: u.toString() }); else { await navigator.clipboard.writeText(u.toString()); toast(t('linkCopied')); } } catch {}
  };
  $('#favBtn').onclick = () => { const on = favs.toggle(L.id); $('#favBtn svg').style.fill = on ? 'var(--brand)' : 'none'; toast(on ? t('favSaved') : t('favRemoved')); };
  if ($('#openSched')) $('#openSched').onclick = () => $('#schedModal').classList.add('open');
  document.querySelectorAll('[data-close]').forEach((b) => { b.innerHTML = I.x; b.onclick = () => b.closest('.modal').classList.remove('open'); });
  $('#schedModal').onclick = (e) => { if (e.target.id === 'schedModal') e.currentTarget.classList.remove('open'); };

  // Fotos
  $('#allList').innerHTML = L.photos.map((p, i) => `<img src="${esc(p)}" data-i="${i}" alt="${t('photo')} ${i + 1}" loading="lazy">`).join('');
  $('#closeAll').innerHTML = I.left.replace('<svg', '<svg width="16" height="16"');
  const openAll = () => { $('#allPhotos').classList.add('open'); document.body.style.overflow = 'hidden'; };
  $('#closeAll').onclick = () => { $('#allPhotos').classList.remove('open'); document.body.style.overflow = ''; };
  if ($('#showAll')) $('#showAll').onclick = (e) => { e.stopPropagation(); openAll(); };
  document.querySelectorAll('.gallery button[data-i]').forEach((b) => b.onclick = () => (L.photos.length > 1 ? openAll() : openLb(0)));
  $('#allList').onclick = (e) => { const im = e.target.closest('img'); if (im) openLb(+im.dataset.i); };
}

function openLb(i) {
  lbIndex = (i + L.photos.length) % L.photos.length;
  $('#lbi').src = L.photos[lbIndex]; $('#lbt').textContent = `${lbIndex + 1} / ${L.photos.length}`;
  $('#lb').classList.add('open'); document.body.style.overflow = 'hidden';
}
$('#lbx').innerHTML = I.x.replace('stroke="currentColor"', 'stroke="#fff"') + ' ' + t('close');
$('#lbp').innerHTML = I.left.replace('<svg', '<svg width="16" height="16"');
$('#lbn').innerHTML = I.right.replace('<svg', '<svg width="16" height="16"');
$('#lbx').onclick = () => { $('#lb').classList.remove('open'); if (!$('#allPhotos').classList.contains('open')) document.body.style.overflow = ''; };
$('#lbp').onclick = () => openLb(lbIndex - 1);
$('#lbn').onclick = () => openLb(lbIndex + 1);
document.addEventListener('keydown', (e) => {
  if (!$('#lb').classList.contains('open')) return;
  if (e.key === 'Escape') $('#lbx').click(); if (e.key === 'ArrowLeft') openLb(lbIndex - 1); if (e.key === 'ArrowRight') openLb(lbIndex + 1);
});

Promise.all([api('/api/listings/' + id), api('/api/schedule/' + id).catch(() => ({ available: [] }))]).then(([r, s]) => { L = r; AV = s.available || []; render(); }).catch(() => {
  $('#page').innerHTML = `<div class="lwrap empty"><h2>${t('notFound')}</h2><p>${t('removed')}</p><p style="margin-top:20px"><a class="btn btn-dark" href="${withLang('/')}">${t('seeAll')}</a></p></div>`;
});
</script>
</body>
</html>
